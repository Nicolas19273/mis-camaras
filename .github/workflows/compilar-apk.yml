# Compila la app para Android cada vez que se actualiza el código
# y publica el APK en la sección "Releases" del repositorio.
# También se puede lanzar a mano desde la pestaña "Actions" → "Run workflow".

name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Guarda la firma de la app entre compilaciones, para que Android
      # deje actualizar la app encima de la versión anterior.
      - name: Recuperar firma de la app
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: firma-app-v1

      - name: Armar proyecto Flutter
        run: |
          flutter --version
          flutter create --org cl.miscamaras --project-name mis_camaras --platforms android app
          rm -rf app/lib app/test
          cp -r lib test app/
          cd app
          flutter pub add media_kit media_kit_video media_kit_libs_video shared_preferences flutter_secure_storage
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          sed -i 's|android:label="mis_camaras"|android:label="Mis Cámaras"|' "$MANIFEST"
          grep -n "INTERNET\|android:label" "$MANIFEST"

      - name: Revisar código
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Compilar APK
        working-directory: app
        run: >
          flutter build apk --release
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          APK="MisCamaras-$TAG.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Mis Cámaras $TAG" \
            --notes "Toca el archivo $APK para descargarlo e instalarlo en tu Android."
