# Compila la app para Android cada vez que se actualiza el código
# y publica el APK en la sección "Releases" del repositorio.
# La app revisa esa sección para ofrecer actualizaciones.
# También se puede lanzar a mano desde la pestaña "Actions" → "Run workflow".

name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-apk
  cancel-in-progress: true

env:
  VERSION_BASE: '0.5'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # La firma de la app se guarda entre compilaciones. Si cambia, Android
      # no deja instalar la versión nueva encima de la anterior.
      # El flujo "mantener-firma.yml" evita que GitHub la borre por inactividad.
      - name: Recuperar firma de la app
        id: firma
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: firma-app-v1

      - name: Armar proyecto Flutter
        run: |
          flutter --version
          flutter create --org cl.miscamaras --project-name mis_camaras --platforms android app
          rm -rf app/lib app/test
          cp -r lib test app/
          cd app
          flutter pub add media_kit media_kit_video media_kit_libs_video \
            shared_preferences flutter_secure_storage http open_filex crypto background_downloader "gal:^2.3.0"

          # Permisos: internet, instalar actualizaciones, notificaciones y búsqueda en el WiFi.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application|' "$MANIFEST"
          sed -i 's|android:label="mis_camaras"|android:label="Mis Cámaras"|' "$MANIFEST"
          # Permite hablar por HTTP con las cámaras de la red local (PTZ y configuración).
          sed -i 's|<application|<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"|' "$MANIFEST"
          grep -n "permission\|android:label\|Cleartext" "$MANIFEST"

          # El descargador en segundo plano necesita Kotlin 2.1 o más nuevo.
          SETTINGS=android/settings.gradle.kts
          [ -f "$SETTINGS" ] || SETTINGS=android/settings.gradle
          KV=$(grep -oE 'org\.jetbrains\.kotlin\.android"\)? version "[0-9.]+' "$SETTINGS" | grep -oE '[0-9.]+$' || true)
          echo "Kotlin del proyecto: ${KV:-desconocido}"
          if [ -n "$KV" ] && [ "$(printf '%s\n' "$KV" 2.1.0 | sort -V | head -n1)" != "2.1.0" ]; then
            sed -i -E 's/(org\.jetbrains\.kotlin\.android"\)? version ")[0-9.]+/\12.1.20/' "$SETTINGS"
            echo "Kotlin actualizado a 2.1.20"
          fi
          grep -n "kotlin" "$SETTINGS" || true

          # Actividad principal con el permiso de búsqueda en la red (MulticastLock).
          MAIN_ACTIVITY=$(find android/app/src/main -name 'MainActivity.kt' | head -n1)
          echo "MainActivity: $MAIN_ACTIVITY"
          head -n1 "$MAIN_ACTIVITY"
          cp ../branding/android/MainActivity.kt "$MAIN_ACTIVITY"

          # Ícono propio de la app.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r ../branding/android/res/. android/app/src/main/res/

      - name: Revisar código
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Compilar APK
        working-directory: app
        run: >
          flutter build apk --release
          --build-name=${{ env.VERSION_BASE }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=VERSION_NAME=${{ env.VERSION_BASE }}.${{ github.run_number }}
          --dart-define=GITHUB_REPO=${{ github.repository }}

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          FIRMA_NUEVA: ${{ steps.firma.outputs.cache-hit != 'true' }}
        run: |
          TAG="v${VERSION_BASE}.${{ github.run_number }}"
          APK="MisCamaras-$TAG.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$APK"

          TITLE=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          [ -z "$TITLE" ] && TITLE="Compilación manual"
          {
            echo "$TITLE"
            if [ "$FIRMA_NUEVA" = "true" ]; then
              echo
              echo "⚠️ Esta versión tiene una firma nueva. Si Android no deja instalarla encima,"
              echo "desinstala la versión anterior y vuelve a instalar."
            fi
          } > notas.txt

          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Mis Cámaras $TAG" \
            --notes-file notas.txt
